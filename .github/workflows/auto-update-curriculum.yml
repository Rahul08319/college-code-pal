name: Automated Yearly Academic & Curriculum Sync

on:
  schedule:
    # Runs at 00:00 UTC on January 1st and August 1st every year (Start of Spring & Fall Semesters)
    - cron: '0 0 1 1,8 *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  yearly-sync:
    name: Sync Curriculum & Verify Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Code Analysis & TypeSafe Benchmarks
        run: npm run build

      - name: Log Academic Sync Status
        run: |
          YEAR=$(date +"%Y")
          NEXT_YEAR=$((YEAR + 1))
          echo "Academic Session ${YEAR}-${NEXT_YEAR} verified and synced successfully!"
